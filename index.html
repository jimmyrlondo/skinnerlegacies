<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skinner Legacies | Coming Soon</title>
    <meta name="description" content="Skinner Legacies — something new is on the way." />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .coming-soon-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }

      .coming-soon-card {
        width: min(560px, 100%);
        border-radius: var(--radius-xl);
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(23, 34, 49, 0.92), rgba(13, 20, 29, 0.96));
        box-shadow: var(--shadow);
        padding: clamp(2rem, 6vw, 3.5rem);
      }

      .coming-soon-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 2rem;
        text-decoration: none;
        color: var(--white);
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .coming-soon-brand img {
        width: 48px;
        height: 48px;
        padding: 0.3rem;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .coming-soon-card h1 {
        max-width: none;
        font-size: clamp(2rem, 6vw, 3rem);
        margin-bottom: 1rem;
      }

      .coming-soon-card p {
        font-size: 1.05rem;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="coming-soon-page">
      <div class="coming-soon-card">
        <a class="coming-soon-brand" href="/">
          <img src="images/logo.png" alt="Skinner Legacies logo" />
          <span>Skinner Legacies</span>
        </a>
        <p class="eyebrow">Stay tuned</p>
        <h1>Coming Soon</h1>
        <p>We're working on something great. Check back shortly.</p>
      </div>
    </div>
  </body>
</html>
